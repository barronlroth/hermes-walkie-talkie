name: walkie-talkie
version: 0.1.5
description: "Schedule a labelled, one-hop message in another default-profile topic via the authenticated local gateway owner. Requires plugins.entries.walkie-talkie.allow_gateway_injection: true. Scheduling is not confirmation of execution."
requires_hermes: ">=0.23.4"
author: "@barronlroth"
provides_tools:
  - list_topics
  - message_topic
provides_hooks:
  - pre_llm_call
